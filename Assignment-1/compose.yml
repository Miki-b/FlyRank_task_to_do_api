services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:dev@db:5432/tasks"
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: